productDirectory:
  title: Set up, secure, and operate your device fleet
  summary: Explore the core capabilities of Microsoft Intune and learn how to manage, secure, and support devices across your
    organization.
  items:
  - title: Get started
    url: fundamentals/index.yml
    summary: Set up your Intune environment, understand architecture and licensing, and deploy your first policies.
    imageSrc: media/icons/hub-page/get-started.svg
  - title: Enroll devices
    url: device-enrollment/index.yml
    summary: Onboard Windows, Apple, Android, and Linux devices using automated, user-driven, or bulk enrollment methods.
    imageSrc: media/icons/hub-page/device-enrollment.svg
  - title: Configure devices
    url: device-configuration/index.yml
    summary: Push settings, restrictions, and platform templates to devices with configuration profiles and the settings catalog.
    imageSrc: media/icons/hub-page/device-configuration.svg
  - title: Manage apps
    url: app-management/index.yml
    summary: Add, deploy, configure, and protect apps across managed and unmanaged devices using app policies and assignments.
    imageSrc: media/icons/hub-page/app-management.svg
  - title: Govern and administer
    url: govern-administer.yml
    summary: Configure role-based access, scope tags, audit logs, and tenant-wide policies to operate Intune at scale.
    imageSrc: media/icons/hub-page/rbac.svg
  - title: Keep devices updated
    url: device-updates/index.yml
    summary: Manage OS and driver updates for Windows, iOS, macOS, and Android devices with update rings, expedited updates,
      and policies.
    imageSrc: media/icons/hub-page/device-updates.svg
  - title: Secure devices and data
    url: device-security/index.yml
    summary: Enforce compliance, deploy security baselines, integrate Defender for Endpoint, and manage endpoint security
      policies.
    imageSrc: media/icons/hub-page/device-security.svg
  - title: Protect apps and data
    url: app-management/protection/index.yml
    summary: Safeguard corporate data with app protection policies, conditional launch rules, and mobile application management
      for managed and unmanaged devices.
    imageSrc: media/icons/hub-page/app-protection.svg
  - title: Manage devices
    url: device-management/index.yml
    summary: Perform remote actions, manage device inventory and lifecycle, and provide remote assistance to users.
    imageSrc: media/icons/hub-page/device-management.svg
  - title: Monitor and troubleshoot
    url: monitor-troubleshoot.yml
    summary: Track device health, compliance trends, and app deployment status with built-in reports and Endpoint Analytics.
    imageSrc: media/icons/hub-page/reports.svg
  - title: Copilot and agents
    url: copilot/index.md
    summary: Use AI-powered Copilot and autonomous agents to query device data, troubleshoot issues, and streamline IT workflows.
    imageSrc: media/icons/hub-page/copilot.svg
  - title: Develop and automate
    url: developer/index.yml
    summary: Use Microsoft Graph APIs, PowerShell, and the Intune Data Warehouse to automate management tasks and build custom
      integrations.
    imageSrc: media/icons/hub-page/developer.svg
